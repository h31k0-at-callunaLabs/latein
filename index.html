<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oda Schule</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schule">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F0F8;--surface:#FFFFFF;--ink:#1D1930;--muted:#5C5675;--violet:#4E3D96;--line:#D7D2E6;--soon:#D85F1C;--soonbg:#FBE5D8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15121F;--surface:#1F1B2E;--ink:#ECE9F5;--muted:#A8A1C0;--violet:#B4A6F0;--line:#38324F;--soon:#F59A62;--soonbg:#3E261A;color-scheme:dark}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,sans-serif}
main{max-width:40rem;margin:0 auto;padding:2rem 1rem 3rem}
h1{font:800 clamp(2rem,8vw,2.8rem)/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 .3rem}
h2{font:600 1rem "Atkinson Hyperlegible",sans-serif;color:var(--muted);margin:2rem 0 .6rem}
p.sub{color:var(--muted);margin:0 0 1rem}
a.fach{display:grid;grid-template-columns:3rem 1fr;gap:.2rem .9rem;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:1rem;margin:0 0 .7rem}
a.fach:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.ic{grid-row:span 2;font-size:2rem;text-align:center}
.t{font:800 1.25rem "Bricolage Grotesque",sans-serif}
.d{color:var(--muted);font-size:.95rem}
.when{display:inline-block;margin-top:.3rem;font-size:.85rem;font-weight:700;padding:.1rem .5rem;border-radius:4px;background:var(--soonbg);color:var(--ink);border-left:3px solid var(--soon)}
.go{display:block;margin-top:.7rem;background:var(--violet);color:var(--surface);font-weight:700;text-align:center;padding:.6rem;border-radius:10px}
.past{opacity:.75}
.past .when{background:transparent;border-left-color:var(--line);color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Hallo! 👋</h1>
  <p class="sub">Tippe auf das Fach, für das du lernen willst.</p>
  <h2>Diese Arbeit kommt als Nächstes</h2>
  <div id="next"></div>
  <h2 id="h-past">Schon geschrieben (zum Wiederholen)</h2>
  <div id="past"></div>
</main>
<script>
// Neue Fächer einfach hier ergänzen: Ordnername, Datum der Arbeit (JJJJ-MM-TT)
const FAECHER=[
  {pfad:"chemie/index.html",fach:"Chemie",thema:"Chemische Reaktionen, Energie, Nachweise",datum:"2026-11-17",icon:"⚗️",farbe:"#D85F1C"},
  {pfad:"latein/index.html",fach:"Latein",thema:"Lektion 12: Imperfekt und Perfekt, Pronomina, Aeneas",datum:"2026-11-12",icon:"🏛️",farbe:"#245F86"}
];
const heute=new Date();heute.setHours(0,0,0,0);
const fmt=d=>d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"numeric"});
function karte(f,vorbei){
  const d=new Date(f.datum+"T00:00:00");const tage=Math.round((d-heute)/864e5);
  const wann=vorbei?`geschrieben am ${fmt(d)}`:tage===0?"Arbeit heute":tage===1?"Arbeit morgen":`Arbeit am ${fmt(d)} · noch ${tage} Tage`;
  return `<a class="fach${vorbei?" past":""}" href="${f.pfad}" style="--c:${f.farbe}"><span class="ic" aria-hidden="true">${f.icon}</span><span class="t">${f.fach}</span><span><span class="d">${f.thema}</span><br><span class="when">${wann}</span>${vorbei?"":"<span class=\"go\">Hier tippen zum Lernen →</span>"}</span></a>`;
}
const kommend=FAECHER.filter(f=>new Date(f.datum+"T00:00:00")>=heute).sort((a,b)=>a.datum.localeCompare(b.datum));
const alt=FAECHER.filter(f=>new Date(f.datum+"T00:00:00")<heute).sort((a,b)=>b.datum.localeCompare(a.datum));
document.getElementById("next").innerHTML=kommend.length?kommend.map(f=>karte(f,false)).join(""):'<p class="sub">Gerade steht keine Arbeit an.</p>';
document.getElementById("past").innerHTML=alt.map(f=>karte(f,true)).join("");
if(!alt.length)document.getElementById("h-past").hidden=true;
</script>
</body>
</html>
